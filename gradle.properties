org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.configuration-cache.problems=warn
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# Leave APKs installed after instrumented tests. Without this, the test runner
# uninstalls the app APK after tests complete, which causes Android to remove
# all widget instances from the home screen.
android.injected.androidTest.leaveApksInstalledAfterRun=true
# Disable incremental ASM transforms to prevent stale-cache errors during
# parallel test runs. Adds ~1-2s per build but eliminates ASM corruption.
android.enableIncrementalTransforms=false
android.builtInKotlin=true
android.newDsl=true
ksp.useKSP2=true
